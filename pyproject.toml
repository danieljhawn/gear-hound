[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gear-hound"
version = "0.1.0"
description = "Private used music gear and barter discovery dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Daniel Hawn", email = "danieljhawn@users.noreply.github.com" },
]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
