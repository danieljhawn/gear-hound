[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gear-hound"
version = "0.1.0"
description = "Private used music gear and barter discovery dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Daniel Hawn", email = "danieljhawn@users.noreply.github.com" },
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
